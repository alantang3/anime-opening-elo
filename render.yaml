# Render Blueprint — one Node web service that serves the API, the
# Socket.IO websocket, AND the built React app, with a persistent disk so
# player Elo / leaderboard survive redeploys.
#
# Deploy: push this repo to GitHub, then on render.com →
#   New → Blueprint → pick the repo. Render reads this file.
#
# NOTE: persistent disks require a paid instance (the `starter` plan, ~$7/mo).
# Render's free plan has NO disk and sleeps after ~15 min idle (a cold start
# drops any in-progress match). For a free deploy, remove the `disk:` block
# and set `plan: free` — but the SQLite DB then resets on every deploy.
services:
  - type: web
    name: anime-opening-elo
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      - key: DATA_DIR
        value: /var/data
      # Google OAuth Web client ID. Not a secret (it ships to every browser
      # and is origin-restricted to your domains), so keeping it here is fine.
      - key: GOOGLE_CLIENT_ID
        value: 657498565875-34hionbg133e8t7ggj1v5u1t95htjec5.apps.googleusercontent.com
      # Optional: auto-generated into DATA_DIR if left unset.
      - key: SESSION_SECRET
        sync: false
      # Postgres connection string. Set this in the Render dashboard to
      # your Supabase Pro pooled connection string (port 6543 for the
      # transaction pooler; port 5432 also works but each connection
      # counts against the project's Postgres limit). The server will
      # refuse to boot without it.
      - key: DATABASE_URL
        sync: false
      # Cloudflare R2 avatar storage. All FIVE must be set for R2 mode;
      # if any is missing the server transparently falls back to writing
      # avatars to the persistent disk (Phase 1 behavior). The two
      # secret values (access key + secret) use sync: false so they're
      # only set in the Render dashboard, never committed here.
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Phase 3: Upstash Redis connection string (rediss://...). Required
      # for the Socket.IO Redis adapter (multi-instance broadcasts),
      # cross-instance rate limits, and shared search cache. Without it
      # the server falls back to single-instance in-memory equivalents,
      # so you can deploy this code before signing up for Upstash.
      - key: REDIS_URL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
